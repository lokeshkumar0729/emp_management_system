# Starts MySQL, the Spring Boot API and the React app.
#   cp .env.example .env   (then edit the values)
#   docker compose up --build
# App: http://localhost:${WEB_PORT:-3000}
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ems
      MYSQL_USER: ems
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/ems?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ems
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters)}
      SEED_DATA: ${SEED_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build: .
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  db-data:
